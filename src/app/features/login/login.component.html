<div class="login-page">
  <form class="login-card" [formGroup]="loginForm" (ngSubmit)="submit()">
    <h1>Prijava</h1>
    <p>Prijavite se za pristup sistemu teretane.</p>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="Unesite email" />

      <small
        *ngIf="
          loginForm.get('email')?.touched &&
          loginForm.get('email')?.hasError('required')
        "
      >
        Email je obavezan.
      </small>

      <small
        *ngIf="
          loginForm.get('email')?.touched &&
          loginForm.get('email')?.hasError('email')
        "
      >
        Email nije validan.
      </small>
    </div>

    <div class="form-group">
      <label>Lozinka</label>
      <input
        type="password"
        formControlName="password"
        placeholder="Unesite lozinku"
      />

      <small
        *ngIf="
          loginForm.get('password')?.touched &&
          loginForm.get('password')?.hasError('required')
        "
      >
        Lozinka je obavezna.
      </small>
    </div>

    <div class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit">Prijavi se</button>
  </form>
</div>
